<!DOCTYPE html>
<html>
<head>
    <title>Perlin/Simplex Noise Visualizer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #222; color: #ddd; }
        canvas { border: 1px solid #555; background-color: #333; display: block; margin: 20px auto; }
        .controls { background-color: #333; padding: 15px; border-radius: 8px; max-width: 600px; margin: 20px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .controls label { text-align: left; }
        .controls input[type="range"] { width: 100%; }
        .config-display { text-align: left; margin-top: 10px; font-size: 0.8em; color: #aaa; white-space: pre-wrap; word-break: break-all; }
        h2 { color: #ff9800; }
        .note { font-size: 0.85em; color: #aaa; max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
    <h2>Perlin/Simplex Noise Visualizer</h2>
    <p>This is a client-side visualization based on the E4 board's configuration.</p>
    <p class="note">Offline demo is enabled if the board is not reachable.</p>
    <canvas id="noiseCanvas" width="320" height="320"></canvas>

    <div class="controls">
        <label>Refresh Interval (ms): <span id="refreshVal">100</span></label>
        <input type="range" id="refreshInterval" min="50" max="1000" value="100">
        <label>Animation Speed: <span id="animSpeedVal">1.0</span></label>
        <input type="range" id="animationSpeed" min="0.1" max="5" step="0.1" value="1.0">
        <button onclick="fetchConfig()">Fetch Latest Config from E4 Board</button>
        <label>Offline Demo: <span id="offlineVal">ON</span></label>
        <input type="range" id="offlineToggle" min="0" max="1" step="1" value="1">
    </div>

    <div class="controls">
        <h3>Current E4 Config:</h3>
        <pre id="currentConfig" class="config-display"></pre>
    </div>

    <script>
        const canvas = document.getElementById('noiseCanvas');
        const ctx = canvas.getContext('2d');
        const refreshIntervalSlider = document.getElementById('refreshInterval');
        const refreshValSpan = document.getElementById('refreshVal');
        const animationSpeedSlider = document.getElementById('animationSpeed');
        const animSpeedValSpan = document.getElementById('animSpeedVal');
        const currentConfigPre = document.getElementById('currentConfig');

        let currentCfg = null;
        let animationTime = 0;
        let lastTimestamp = 0;
        const pathHistory = [];
        const MAX_PATH_HISTORY = 200; // Store last 200 points
        let configFetchInterval = null;
        const offlineToggle = document.getElementById('offlineToggle');
        const offlineVal = document.getElementById('offlineVal');

        const offlineCfg = {
            running: 1,
            moveType: 2,
            speed: 0.7,
            angle: 45,
            radius: 120,
            framesize: 0.02,
            contrast: 1.0,
            zShape: 1.0,
            rangeDeg: 300,
            motorSpacingCm: 25
        };

        // --- Basic 2D Simplex Noise implementation (simplified for visualization) ---
        // This is a simplified version and might not be 100% identical to the C++ library,
        // but should provide similar visual characteristics.
        // Based on "Simplex noise demystified" by Stefan Gustavson
        function SimplexNoise2D() {
            const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
            const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;

            const p = new Uint8Array(256);
            for (let i = 0; i < 256; i++) p[i] = Math.floor(Math.random() * 256);

            const perm = new Uint8Array(512);
            const permMod12 = new Uint8Array(512);
            for (let i = 0; i < 512; i++) {
                perm[i] = p[i & 255];
                permMod12[i] = perm[i] % 12;
            }

            function grad(hash, x, y) {
                const h = hash % 6;
                const u = h < 4 ? x : y;
                const v = h < 4 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            return function(x, y) {
                let s = (x + y) * F2;
                let i = Math.floor(x + s);
                let j = Math.floor(y + s);
                let t = (i + j) * G2;
                let X0 = i - t;
                let Y0 = j - t;
                let x0 = x - X0;
                let y0 = y - Y0;

                let i1, j1;
                if (x0 > y0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }

                let x1 = x0 - i1 + G2;
                let y1 = y0 - j1 + G2;
                let x2 = x0 - 1.0 + 2.0 * G2;
                let y2 = y0 - 1.0 + 2.0 * G2;

                const ii = i & 255;
                const jj = j & 255;

                let t0 = 0.5 - x0 * x0 - y0 * y0;
                let n0 = 0.0;
                if (t0 >= 0) {
                    t0 *= t0;
                    n0 = t0 * t0 * grad(permMod12[ii + perm[jj]], x0, y0);
                }

                let t1 = 0.5 - x1 * x1 - y1 * y1;
                let n1 = 0.0;
                if (t1 >= 0) {
                    t1 *= t1;
                    n1 = t1 * t1 * grad(permMod12[ii + i1 + perm[jj + j1]], x1, y1);
                }

                let t2 = 0.5 - x2 * x2 - y2 * y2;
                let n2 = 0.0;
                if (t2 >= 0) {
                    t2 *= t2;
                    n2 = t2 * t2 * grad(permMod12[ii + 1 + perm[jj + 1]], x2, y2);
                }

                // Scale to roughly -1 to 1
                return 70.0 * (n0 + n1 + n2);
            };
        }
        const noise2D = SimplexNoise2D();

        function convertToGrayscale(noiseVal, contrast, zShape) {
            // Apply Z-Shape (gamma correction)
            let nNorm = (noiseVal + 1.0) / 2.0; // Normalize to 0..1
            let exponent = Math.abs(zShape);
            if (exponent < 0.1) exponent = 0.1;
            let nShaped = Math.pow(nNorm, exponent);
            if (zShape < 0) {
                nShaped = 1.0 - nShaped;
            }
            let finalNoise = (nShaped * 2.0) - 1.0; // Back to -1..1

            // Apply contrast (amplitude) - this also indirectly affects perceived brightness
            let scaledNoise = finalNoise * contrast;

            // Map to 0-255 grayscale
            let gray = Math.floor(((scaledNoise + 1.0) / 2.0) * 255);
            return Math.max(0, Math.min(255, gray));
        }

        function drawNoiseField() {
            if (!currentCfg) return;

            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            const cfg = currentCfg;
            const framesize = cfg.framesize;
            const contrast = cfg.contrast;
            const zShape = cfg.zShape;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    // Map canvas coordinates to noise coordinates, scaled by framesize
                    const noiseX = (x - canvas.width / 2) * framesize;
                    const noiseY = (y - canvas.height / 2) * framesize;
                    let noiseVal = noise2D(noiseX, noiseY);
                    
                    const gray = convertToGrayscale(noiseVal, contrast, zShape);

                    const index = (y * canvas.width + x) * 4;
                    data[index] = gray;     // Red
                    data[index + 1] = gray; // Green
                    data[index + 2] = gray; // Blue
                    data[index + 3] = 255;  // Alpha
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        let flightX = 0;
        let flightY = 0;
        let timeAccumulator = 0; // For circular/figure-8 paths

        function updateSimulation(dt) {
            if (!currentCfg || !currentCfg.running) return;

            const cfg = currentCfg;
            const speed = cfg.speed * animationSpeedSlider.value; // Scale animation speed
            const angle = cfg.angle;
            const radius = cfg.radius;
            const moveType = cfg.moveType;
            const framesize = cfg.framesize;

            // --- 1. PATH GENERATOR (Mimic C++ loop) ---
            if (moveType === 0) { // Linear
                const rad = angle * Math.PI / 180.0;
                flightX += Math.cos(rad) * speed * dt * 10.0;
                flightY += Math.sin(rad) * speed * dt * 10.0;
                // Drift limiting (mimic C++ fmod)
                const wrapLimit = 1000000.0;
                flightX = flightX % wrapLimit;
                flightY = flightY % wrapLimit;
            } else { // Loop / Lissajous
                timeAccumulator += speed * dt;
                if (moveType === 1) { // Circle
                    flightX = radius * Math.cos(timeAccumulator);
                    flightY = radius * Math.sin(timeAccumulator);
                } else if (moveType === 2) { // Figure 8
                    flightX = radius * Math.cos(timeAccumulator);
                    flightY = (radius * 0.5) * Math.sin(timeAccumulator * 2.0);
                }
            }

            // Store path history
            pathHistory.push({ x: flightX, y: flightY });
            if (pathHistory.length > MAX_PATH_HISTORY) {
                pathHistory.shift();
            }
        }

        function drawPathAndMotors() {
            if (!currentCfg) return;

            const cfg = currentCfg;
            const framesize = cfg.framesize;
            const canvasCenterX = canvas.width / 2;
            const canvasCenterY = canvas.height / 2;

            // --- Draw path history ---
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)'; // Green path
            ctx.lineWidth = 1;
            pathHistory.forEach((point, index) => {
                const alpha = index / pathHistory.length; // Fade out older points
                ctx.strokeStyle = `rgba(0, 255, 0, ${alpha * 0.5})`;
                const px = canvasCenterX + point.x / framesize;
                const py = canvasCenterY + point.y / framesize;
                if (index === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            });
            ctx.stroke();

            // --- Draw current Flight Path position ---
            ctx.beginPath();
            ctx.arc(canvasCenterX + flightX / framesize, canvasCenterY + flightY / framesize, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'red';
            ctx.fill();

            // --- Draw Motors ---
            for (let i = 0; i < 4; i++) {
                const motorX = canvasCenterX + (flightX + cfg.motorOffsets[i].x) / framesize;
                const motorY = canvasCenterY + (flightY + cfg.motorOffsets[i].y) / framesize;
                
                ctx.beginPath();
                ctx.arc(motorX, motorY, 5, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${i * 90}, 100%, 50%)`; // Different color for each motor
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.font = '8px Arial';
                ctx.fillText(`M${i+1}`, motorX - 6, motorY + 2);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            drawNoiseField();
            drawPathAndMotors();
        }

        let animationFrameId = null;
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = (timestamp - lastTimestamp) / 1000.0; // in seconds
            lastTimestamp = timestamp;

            updateSimulation(deltaTime);
            render();
            animationFrameId = requestAnimationFrame(animate);
        }

        function stopAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        async function fetchConfig() {
            try {
                const response = await fetch("/config");
                const cfg = await response.json();
                currentCfg = cfg;
                currentConfigPre.textContent = JSON.stringify(cfg, null, 2);
                console.log("Fetched config:", cfg);
                // Reset simulation variables when config is fetched/changed
                flightX = 0;
                flightY = 0;
                timeAccumulator = 0;
                pathHistory.length = 0; // Clear history

                stopAnimation();
                animate(0); // Restart animation with new config
            } catch (error) {
                console.error("Failed to fetch config:", error);
                currentCfg = { ...offlineCfg };
                currentConfigPre.textContent = "Offline demo mode (board not reachable). Using local config.\n\n" + JSON.stringify(currentCfg, null, 2);
                offlineToggle.value = 1;
                offlineVal.textContent = "ON";
                stopAnimation();
                animate(0);
            }
        }

        refreshIntervalSlider.addEventListener('input', () => {
            refreshValSpan.textContent = refreshIntervalSlider.value;
            // No need to restart animation, just updates display
        });
        animationSpeedSlider.addEventListener('input', () => {
            animSpeedValSpan.textContent = animationSpeedSlider.value;
        });

        offlineToggle.addEventListener('input', () => {
            const on = offlineToggle.value === "1";
            offlineVal.textContent = on ? "ON" : "OFF";
            if (on) {
                currentCfg = { ...offlineCfg };
                currentConfigPre.textContent = "Offline demo mode.\n\n" + JSON.stringify(currentCfg, null, 2);
                stopAnimation();
                animate(0);
            } else {
                fetchConfig();
            }
        });

        // Initial fetch and start animation
        fetchConfig();

        // Periodically fetch config to reflect real-time changes from E4 board
        configFetchInterval = setInterval(fetchConfig, refreshIntervalSlider.value);
        refreshIntervalSlider.addEventListener('change', () => {
            clearInterval(configFetchInterval);
            configFetchInterval = setInterval(fetchConfig, refreshIntervalSlider.value);
        });

    </script>
</body>
</html>
