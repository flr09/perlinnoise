[env:fysetc_e4]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; You might need to specify a different board or settings
; depending on the exact E4 variant or if FYSETC provides a custom board definition.
; For now, 'esp32dev' is a good generic starting point for ESP32.
; Build flags for Marlin might go here if you were building Marlin directly.
; For a simple Arduino sketch, these defaults are fine.
; #change: Added explicit library dependencies for reproducible builds.
; #author: Codex
; #time: 2026-02-05 18:45:26 CET
; #version: 0.2.3
lib_deps =
  https://github.com/SRombauts/SimplexNoise
  https://github.com/me-no-dev/AsyncTCP
  https://github.com/me-no-dev/ESPAsyncWebServer
  https://github.com/teemuatlut/TMCStepper
  https://github.com/waspinator/AccelStepper
